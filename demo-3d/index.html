<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Boxing Fit · Demo 3D</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f7ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 25%,#1e3151,#0b1020 65%)}header{padding:18px 18px 8px;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}small{color:#a9b7d0}.pill{border:1px solid #365271;border-radius:20px;padding:7px 10px;font-size:12px;color:#a5e7c8}.stage{position:relative;height:min(59dvh,610px);min-height:320px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:pan-y}.overlay{position:absolute;top:14px;left:16px;pointer-events:none}.overlay strong{font-size:24px}.overlay p{color:#a9b7d0;font-size:13px;margin:5px 0}.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#8ea4c1;font-size:12px;pointer-events:none}.panel{background:#151e31;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));min-height:220px}.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.moves button{background:#24334b;color:white;border:1px solid #3b4d69;padding:13px 5px;border-radius:12px;font-size:14px;font-weight:700}.moves button.active{background:#f8bc44;color:#1a1b20;border-color:#f8bc44}.toolbar{display:flex;align-items:center;gap:12px;margin-top:16px}.toolbar label{font-size:13px;color:#b8c7de;white-space:nowrap}.toolbar input{flex:1;accent-color:#f8bc44}.toolbar button{border:0;background:#344760;color:white;padding:11px 13px;border-radius:10px}.notice{color:#a9b7d0;font-size:12px;margin:13px 0 0}.error{padding:20px;color:#ffd18b}.counter{font-variant-numeric:tabular-nums;color:#f8bc44;font-weight:800}
</style></head><body><header><div><h1>🥊 Boxing Fit <span style="color:#f8bc44">3D</span></h1><small>Protótipo de movimento · iPhone</small></div><span class="pill">DEMO</span></header><main><div class="stage" id="stage"><div class="overlay"><strong id="moveTitle">Jab</strong><p id="moveDesc">Golpe reto da mão da frente</p><span class="counter" id="count">0 golpes</span></div><div class="hint">Arraste para girar o treinador</div></div><section class="panel"><div class="moves" id="moves"><button class="active" data-move="jab">Jab</button><button data-move="cross">Direto</button><button data-move="hook">Cruzado</button><button data-move="uppercut">Uppercut</button><button data-move="slip">Esquiva</button><button data-move="combo">Combo 1–2</button></div><div class="toolbar"><label for="speed">Velocidade</label><input id="speed" type="range" min="0.5" max="1.6" step="0.1" value="1"><button id="pause">Pausar</button></div><p class="notice">Treinador 3D procedural com articulações animadas. É um protótipo técnico, não captura de movimento profissional.</p></section></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
const stage=document.querySelector('#stage');const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0b1020,8,17);const camera=new THREE.PerspectiveCamera(37,1,.1,100);camera.position.set(0,2.05,7.5);camera.lookAt(0,1.55,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbad5ff,0x283044,2.2));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(-3,7,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-5;key.shadow.camera.right=5;key.shadow.camera.top=6;key.shadow.camera.bottom=-5;scene.add(key);const rim=new THREE.DirectionalLight(0x5cbcff,2);rim.position.set(4,3,-4);scene.add(rim);
const mat=(c,roughness=.75)=>new THREE.MeshStandardMaterial({color:c,roughness,metalness:.08});const skin=mat(0xb77e5e),shirt=mat(0x1f9eac),shorts=mat(0x1c2843),gloves=mat(0xffa92c,.43),shoes=mat(0xf4f7ff),dark=mat(0x111b2c),trim=mat(0x54d4dd);
function ell(parent,m,x,y,z,sx,sy,sz){let o=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cyl(parent,m,a,b,r1,r2){let d=new THREE.Vector3().subVectors(b,a),o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,d.length(),16),m);o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());o.castShadow=true;parent.add(o);return o}
const floor=new THREE.Mesh(new THREE.CircleGeometry(3.5,64),mat(0x1c2d48));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;floor.receiveShadow=true;scene.add(floor);for(let i=1;i<=3;i++){let ring=new THREE.Mesh(new THREE.RingGeometry(i*.92,i*.92+.012,96),new THREE.MeshBasicMaterial({color:0x34516b,side:THREE.DoubleSide,transparent:true,opacity:.45}));ring.rotation.x=-Math.PI/2;ring.position.y=.001+i*.001;scene.add(ring)}
const root=new THREE.Group();scene.add(root);const hips=new THREE.Group();hips.position.y=1.12;root.add(hips);ell(hips,shorts,0,0,0,.39,.3,.24);const torso=new THREE.Group();torso.position.y=.24;hips.add(torso);ell(torso,shirt,0,.45,0,.46,.66,.27);ell(torso,trim,0,.74,.25,.13,.08,.02);const neck=ell(torso,skin,0,1.03,0,.15,.19,.14);const head=new THREE.Group();head.position.set(0,1.18,0);torso.add(head);ell(head,skin,0,.12,0,.26,.32,.24);ell(head,dark,0,.34,-.04,.27,.10,.25);ell(head,dark,-.11,.15,.23,.025,.027,.012);ell(head,dark,.11,.15,.23,.025,.027,.012);ell(head,dark,0,.02,.245,.08,.023,.018);
function arm(side){let shoulder=new THREE.Group();shoulder.position.set(side*.44,.82,0);torso.add(shoulder);ell(shoulder,shirt,0,-.05,0,.22,.24,.22);const upper=new THREE.Group();shoulder.add(upper);cyl(upper,skin,new THREE.Vector3(0,-.12,0),new THREE.Vector3(0,-.53,0),.135,.115);const elbow=new THREE.Group();elbow.position.y=-.53;upper.add(elbow);ell(elbow,skin,0,0,0,.13,.13,.13);cyl(elbow,skin,new THREE.Vector3(0,0,0),new THREE.Vector3(0,-.43,0),.12,.10);const fist=new THREE.Group();fist.position.y=-.43;elbow.add(fist);ell(fist,gloves,0,-.035,.015,.19,.22,.20);ell(fist,dark,0,-.18,.02,.13,.055,.16);return {shoulder,elbow,fist,upper}}const left=arm(-1),right=arm(1);
function leg(side){let pivot=new THREE.Group();pivot.position.set(side*.22,-.12,0);hips.add(pivot);cyl(pivot,shorts,new THREE.Vector3(0,0,0),new THREE.Vector3(0,-.49,0),.20,.16);const knee=new THREE.Group();knee.position.y=-.49;pivot.add(knee);ell(knee,skin,0,-.01,0,.145,.16,.14);cyl(knee,skin,new THREE.Vector3(0,-.08,0),new THREE.Vector3(0,-.55,0),.13,.095);const foot=new THREE.Group();foot.position.y=-.57;knee.add(foot);ell(foot,shoes,0,-.045,.16,.17,.12,.34);return {pivot,knee,foot}}const lLeg=leg(-1),rLeg=leg(1);
// The boxer faces +Z. Left foot forward, right foot behind.
const base={leftShoulder:[-.18,0,-.42],rightShoulder:[-.18,0,.42]};
function pose(){hips.position.set(0,1.12,0);hips.rotation.set(0,-.16,0);torso.rotation.set(.04,-.08,0);head.rotation.set(0,0,0);left.shoulder.rotation.set(-.87,0,-.24);right.shoulder.rotation.set(-.87,0,.24);left.elbow.rotation.set(-1.43,0,0);right.elbow.rotation.set(-1.43,0,0);left.fist.rotation.set(0,0,0);right.fist.rotation.set(0,0,0);lLeg.pivot.position.set(-.22,-.12,.22);rLeg.pivot.position.set(.22,-.12,-.23);lLeg.pivot.rotation.set(-.13,0,-.10);rLeg.pivot.rotation.set(.15,0,.12);lLeg.knee.rotation.x=.18;rLeg.knee.rotation.x=.23;head.position.set(0,1.18,0)}
const joints=[hips,torso,head,left.shoulder,left.elbow,right.shoulder,right.elbow,lLeg.pivot,rLeg.pivot,lLeg.knee,rLeg.knee];function snapshot(){return joints.map(o=>({p:o.position.clone(),q:o.quaternion.clone()}))}function restore(s){joints.forEach((o,i)=>{o.position.copy(s[i].p);o.quaternion.copy(s[i].q)})}
pose();const neutral=snapshot();const moves={jab:['Jab','Golpe reto da mão da frente'],cross:['Direto','Giro do quadril e ombro de trás'],hook:['Cruzado','Cotovelos alinhados e rotação do tronco'],uppercut:['Uppercut','Força das pernas e rotação curta'],slip:['Esquiva','Desvio lateral com joelhos flexionados'],combo:['Combo 1–2','Jab seguido de direto']};let current='jab',speed=1,paused=false,clock=0,previous=performance.now(),count=0,oldPhase=-1;
function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}function bell(t,begin=.13,peak=.44,end=.77){return t<begin?0:t<peak?smooth((t-begin)/(peak-begin)):t<end?1-smooth((t-peak)/(end-peak)):0}function applyPunch(kind,amount){const s=kind==='jab'?left:right;const other=kind==='jab'?right:left;const direction=kind==='jab'?-1:1;const twist=kind==='jab'?.22:kind==='cross'?.55:kind==='hook'?.68:.30;hips.rotation.y+=direction*twist*amount*.55;torso.rotation.y+=direction*twist*amount;torso.rotation.z+=direction*.06*amount;head.rotation.y-=direction*.09*amount;hips.position.y-=.07*amount;
if(kind==='jab'||kind==='cross'){s.shoulder.rotation.x-=1.03*amount;s.elbow.rotation.x+=1.34*amount;s.shoulder.rotation.y+=direction*.10*amount;s.shoulder.rotation.z+=direction*.12*amount;other.shoulder.rotation.x+=.10*amount}else if(kind==='hook'){s.shoulder.rotation.x-=.35*amount;s.shoulder.rotation.y+=direction*.95*amount;s.shoulder.rotation.z+=direction*.48*amount;s.elbow.rotation.x+=.58*amount;other.shoulder.rotation.x+=.07*amount}else if(kind==='uppercut'){s.shoulder.rotation.x+=.40*amount;s.shoulder.rotation.y+=direction*.20*amount;s.elbow.rotation.x-=.20*amount;s.shoulder.rotation.z+=direction*.18*amount;hips.position.y+=.11*amount;lLeg.knee.rotation.x-=.12*amount;rLeg.knee.rotation.x-=.12*amount}}
function animate(t){restore(neutral);let cycle=t%1, bob=Math.sin(t*Math.PI*2)*.013;hips.position.y+=bob;const shift=Math.sin(t*Math.PI*2)*.018;hips.position.x+=shift;if(current==='slip'){let a=bell(cycle,.10,.40,.72);let direction=Math.floor(t)%2===0?-1:1;hips.position.x+=direction*.20*a;torso.rotation.z+=direction*.28*a;head.rotation.z-=direction*.06*a;hips.position.y-=.16*a;lLeg.knee.rotation.x+=.18*a;rLeg.knee.rotation.x+=.18*a}else if(current==='combo'){const a=bell(cycle,0,.18,.42),b=bell(cycle,.46,.66,.94);applyPunch('jab',a);applyPunch('cross',b)}else{applyPunch(current,bell(cycle))}}
function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-previous)/1000,.05);previous=now;if(!paused){clock+=dt*speed*.75;let phase=Math.floor(clock);if(phase!==oldPhase){if(oldPhase>=0){count++;document.querySelector('#count').textContent=count+' golpes'}oldPhase=phase}}animate(clock);renderer.render(scene,camera)}
function resize(){let w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.move;clock=0;oldPhase=-1;count=0;document.querySelector('#count').textContent='0 golpes';document.querySelector('#moveTitle').textContent=moves[current][0];document.querySelector('#moveDesc').textContent=moves[current][1];document.querySelectorAll('[data-move]').forEach(x=>x.classList.toggle('active',x===b))}));document.querySelector('#speed').addEventListener('input',e=>speed=Number(e.target.value));document.querySelector('#pause').addEventListener('click',e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausar'});
let drag=false,px=0,rot=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-px)*.009;px=e.clientX;root.rotation.y=rot}});
</script></body></html>
